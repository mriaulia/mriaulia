<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0a1226"/>
    </linearGradient>
    <linearGradient id="console" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16223e"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="panel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="0" y="0" width="240" height="300" rx="10"/>
    </clipPath>
  </defs>

  <rect width="900" height="520" fill="url(#bg2)"/>

  <!-- stars -->
  <g fill="#7cc6ff">
    <circle cx="40" cy="40" r="1.4" opacity="0.7"/>
    <circle cx="860" cy="60" r="1.2" opacity="0.6"/>
    <circle cx="820" cy="460" r="1.3" opacity="0.6"/>
    <circle cx="40" cy="480" r="1.2" opacity="0.6"/>
  </g>

  <!-- section label -->
  <text x="40" y="38" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#5b9dff" letter-spacing="2">LEVEL 01</text>
  <text x="40" y="62" font-family="'JetBrains Mono','Courier New',monospace" font-weight="700" font-size="24" fill="#e8eefb" letter-spacing="1">MEET THE PLAYER</text>

  <!-- console -->
  <g transform="translate(40,90)">
    <rect x="0" y="0" width="280" height="400" rx="24" fill="url(#console)" stroke="#1f2c4a" stroke-width="2"/>
    <g transform="translate(20,22)">
      <rect x="-3" y="-3" width="246" height="306" rx="12" fill="#060a14" stroke="#0a0f1c" stroke-width="3"/>
      <g clip-path="url(#screenClip)">
        <rect width="240" height="300" fill="#c7d6f0"/>
        <image href="https://raw.githubusercontent.com/mriaulia/mriaulia/main/avatar.jpg" xlink:href="https://raw.githubusercontent.com/mriaulia/mriaulia/main/avatar.jpg" x="0" y="0" width="240" height="300" preserveAspectRatio="xMidYMax slice"/>
      </g>
    </g>
    <!-- dpad -->
    <g transform="translate(40,352)" fill="#05070d">
      <rect x="8" y="0" width="14" height="40"/>
      <rect x="0" y="8" width="40" height="14"/>
    </g>
    <!-- AB buttons -->
    <g transform="translate(210,352)">
      <circle cx="0" cy="10" r="13" fill="#2f6fed"/>
      <text x="0" y="14" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#061024" font-weight="700">B</text>
      <circle cx="30" cy="0" r="13" fill="#7cc6ff"/>
      <text x="30" y="4" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#061024" font-weight="700">A</text>
    </g>
    <text x="140" y="390" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#7c8bae" letter-spacing="1">PLAYER 01 &#183; UNISKA</text>
  </g>

  <!-- info panels -->
  <g transform="translate(360,90)">
    <!-- Training Log -->
    <rect x="0" y="0" width="500" height="112" rx="12" fill="url(#panel2)" stroke="#2f6fed" stroke-width="2"/>
    <rect x="0" y="0" width="500" height="30" rx="12" fill="#12294f"/>
    <rect x="0" y="18" width="500" height="12" fill="#12294f"/>
    <text x="18" y="20" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="13" fill="#7cc6ff" letter-spacing="1">TRAINING LOG</text>
    <text x="18" y="54" font-family="'JetBrains Mono',monospace" font-size="13" fill="#e8eefb">Bachelor of Computer Science</text>
    <text x="18" y="74" font-family="'JetBrains Mono',monospace" font-size="12" fill="#9db8e8">Informatics Engineering &#183; UNISKA &#183; 2024&#8211;2028</text>
    <text x="18" y="94" font-family="'JetBrains Mono',monospace" font-size="12" fill="#5b9dff">GPA XP: 3.87 / 4.00</text>

    <!-- Skills Mastery -->
    <g transform="translate(0,128)">
      <rect x="0" y="0" width="500" height="146" rx="12" fill="url(#panel2)" stroke="#2f6fed" stroke-width="2"/>
      <rect x="0" y="0" width="500" height="30" rx="12" fill="#12294f"/>
      <rect x="0" y="18" width="500" height="12" fill="#12294f"/>
      <text x="18" y="20" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="13" fill="#7cc6ff" letter-spacing="1">SKILLS MASTERY</text>
      <text x="18" y="52" font-family="'JetBrains Mono',monospace" font-size="12" fill="#c3cfe8">&#9670; Python &#183; Java &#183; PHP &#183; SQL</text>
      <text x="18" y="74" font-family="'JetBrains Mono',monospace" font-size="12" fill="#c3cfe8">&#9670; React.js &#183; Supabase &#183; Axios</text>
      <text x="18" y="96" font-family="'JetBrains Mono',monospace" font-size="12" fill="#c3cfe8">&#9670; Figma &#183; Canva &#183; VS Code</text>
      <text x="18" y="118" font-family="'JetBrains Mono',monospace" font-size="12" fill="#c3cfe8">&#9670; Data Mining &#183; Google Colab &#183; Kaggle</text>
    </g>

    <!-- Mission Log -->
    <g transform="translate(0,290)">
      <rect x="0" y="0" width="500" height="108" rx="12" fill="url(#panel2)" stroke="#2f6fed" stroke-width="2"/>
      <rect x="0" y="0" width="500" height="30" rx="12" fill="#12294f"/>
      <rect x="0" y="18" width="500" height="12" fill="#12294f"/>
      <text x="18" y="20" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="13" fill="#7cc6ff" letter-spacing="1">MISSION LOG</text>
      <text x="18" y="52" font-family="'JetBrains Mono',monospace" font-size="12" fill="#e8eefb">CIRRUS &#8212; Smart Weather Assistant (React.js, Supabase)</text>
      <text x="18" y="74" font-family="'JetBrains Mono',monospace" font-size="12" fill="#e8eefb">Gas Monitoring Device (IoT/TinyML) &#8212; Ministry-funded</text>
      <text x="18" y="94" font-family="'JetBrains Mono',monospace" font-size="11" fill="#5b9dff">STATUS: 2/2 QUESTS COMPLETE</text>
    </g>
  </g>
</svg>
