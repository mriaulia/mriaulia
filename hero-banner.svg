<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#070a16"/>
      <stop offset="100%" stop-color="#0a1226"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f6fed"/>
      <stop offset="100%" stop-color="#5b9dff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="360" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#7cc6ff">
    <circle cx="34" cy="70" r="1.6" opacity="0.8"/>
    <circle cx="70" cy="140" r="1.1" opacity="0.5"/>
    <circle cx="120" cy="40" r="1.4" opacity="0.7"/>
    <circle cx="820" cy="60" r="1.6" opacity="0.8"/>
    <circle cx="860" cy="120" r="1.1" opacity="0.5"/>
    <circle cx="790" cy="170" r="1.3" opacity="0.6"/>
    <circle cx="50" cy="260" r="1.2" opacity="0.5"/>
    <circle cx="855" cy="270" r="1.4" opacity="0.6"/>
    <circle cx="450" cy="24" r="1.1" opacity="0.5"/>
  </g>

  <!-- small pixel diamonds (decorative "stars") -->
  <g fill="#5b9dff">
    <rect x="28" y="200" width="6" height="6" transform="rotate(45 31 203)"/>
    <rect x="864" y="210" width="6" height="6" transform="rotate(45 867 213)"/>
    <rect x="60" y="300" width="5" height="5" transform="rotate(45 62 302)"/>
    <rect x="830" y="300" width="5" height="5" transform="rotate(45 832 302)"/>
  </g>

  <!-- top-left eyebrow: XP -->
  <text x="30" y="34" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#7cc6ff" letter-spacing="1">XP: INFORMATICS ENGINEERING &#183; LEVEL 02</text>

  <!-- top-right: player tag -->
  <text x="870" y="27" text-anchor="end" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#7cc6ff" letter-spacing="1">&#9670; PLAYER: MARIA_AULIA</text>

  <!-- main dialog box -->
  <rect x="90" y="66" width="720" height="228" rx="16" fill="url(#panel)" stroke="#2f6fed" stroke-width="2.5" filter="url(#glow)"/>
  <!-- corner accents -->
  <g fill="#5b9dff">
    <rect x="82" y="58" width="14" height="4"/>
    <rect x="82" y="58" width="4" height="14"/>
    <rect x="804" y="58" width="14" height="4"/>
    <rect x="814" y="58" width="4" height="14"/>
    <rect x="82" y="288" width="14" height="4"/>
    <rect x="82" y="278" width="4" height="14"/>
    <rect x="804" y="288" width="14" height="4"/>
    <rect x="814" y="278" width="4" height="14"/>
  </g>

  <text x="450" y="128" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="20" fill="#5b7ab8" letter-spacing="10">2026</text>

  <!-- PORTFOLIO title, faux-pixel drop shadow -->
  <text x="454" y="196" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-weight="700" font-size="58" fill="#12294f" letter-spacing="6">PORTFOLIO</text>
  <text x="450" y="192" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-weight="700" font-size="58" fill="#e8eefb" letter-spacing="6">PORTFOLIO</text>

  <!-- START button -->
  <g>
    <rect x="378" y="228" width="144" height="42" rx="8" fill="url(#btn)"/>
    <polygon points="404,241 404,257 416,249" fill="#061024"/>
    <text x="460" y="255" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-weight="700" font-size="17" fill="#061024" letter-spacing="2">START</text>
  </g>

  <!-- bottom nav strip -->
  <rect x="0" y="326" width="900" height="34" fill="#0c1a3d"/>
  <text x="30" y="348" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#9db8e8" letter-spacing="1">&#9733; About Me</text>
  <text x="450" y="348" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#9db8e8" letter-spacing="1">&#9733; Projects</text>
  <text x="870" y="348" text-anchor="end" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#9db8e8" letter-spacing="1">&#9733; Contact</text>
</svg>
